[pytest]
# Tests live in tests/. The 'mosaic' package sits in the project root.
testpaths = tests
pythonpath = .
addopts = -ra --strict-markers -p no:cacheprovider
markers =
    unit: fast tests with no dataset, no model weights, no network
    integration: tests across module boundaries using fixtures and mocks only
    model_smoke: one real pretrained-model path works (needs model weights)
    slow: full RWF-2000 training / evaluation / ablations (needs dataset + weights)
